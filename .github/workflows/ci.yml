name: CI

# Runs the full pipeline end-to-end against schema-accurate synthetic data
# on every push/PR — pipeline, model persistence, AND the serving API. This
# is a smoke test, not a substitute for unit tests, but it would have
# caught real bugs (e.g. a pandas dtype issue in feature engineering that
# only surfaced on some datasets) before they reached anyone downstream.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic schema-accurate sample data
        run: python tests/make_synthetic_data.py

      - name: Run pipeline end-to-end and save model bundles
        run: python -m src.run_pipeline --model isolation_forest --save-models

      - name: Verify evaluation report and model bundles were produced
        run: |
          test -f outputs/evaluation_report.csv
          test -n "$(ls models/*.joblib 2>/dev/null)"

      - name: Start serving API and run API smoke test
        run: |
          uvicorn src.serve:app --host 0.0.0.0 --port 8000 &
          sleep 3
          python tests/smoke_test_api.py

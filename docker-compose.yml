services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: 
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./models:/app/models
  
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports: 
      - "8501:8501"
    depends_on: 
      - api
    environment:
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports: 
      - "5000:5000"
    command: mlflow server --host 0.0.0.0
